appId: com.local.pdfmanager
productName: PDF Manager
# Copyright line shown in the .exe "Details" tab.
copyright: "Copyright © 2026 Dramane Bako"
# The publisher name ("D.Bako") comes from package.json "author.name": it is
# shown as Publisher in Apps & features, as Company in the .exe details, and
# names the Start Menu folder (menuCategory: true below).

# Point electron-builder at the Electron entry scripts, not the web source.
directories:
  output: release
  buildResources: build

# Files included in the packaged app.
files:
  - dist/**/*          # built web assets (Vite output)
  - electron/**/*      # main + preload scripts
  - "!**/*.map"        # never ship source maps

# Size: Chromium ships ~55 UI locale packs (~45 MB unpacked). The app's UI is
# its own, so only Chromium's built-in strings (context menus, dialogs) use
# these; keep English and French.
electronLanguages:
  - en-US
  - fr

# Smaller installer/portable at the cost of a slower build.
compression: maximum

# Electron main entry — must match package.json "main".
# electron-builder reads this field automatically from package.json.

# Use the pre-extracted electron binary bundled with the npm package to avoid
# a second download and the EPERM rename issue on Windows.
electronDist: node_modules/electron/dist

asar: true             # pack source into an asar archive (faster startup)
asarUnpack:            # unpack assets PDF.js needs to read at runtime
  - "dist/pdfjs/**"

win:
  requestedExecutionLevel: asInvoker  # never request admin elevation
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]

portable:
  artifactName: "${productName}-${version}-portable.exe"

nsis:
  oneClick: false              # show the installer wizard pages
  perMachine: false            # install into %LOCALAPPDATA%\Programs
  allowElevation: false        # hard-block any elevation request
  allowToChangeInstallationDirectory: false
  menuCategory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: "${productName}-${version}-Setup.exe"
  # Bilingual installer: a language dialog (pre-selected from the Windows
  # display language) lets the user install in English or French. The choice
  # is also saved for the app itself by build/installer.nsh.
  installerLanguages:
    - en_US
    - fr_FR
  multiLanguageInstaller: true
  displayLanguageSelector: true
  include: build/installer.nsh

# Disable auto-update entirely — offline private app, no publish target.
publish: null
